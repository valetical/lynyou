<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>inspirational</title>

        <style>
            body {
                background: black;
                margin: 0;
                height: 100vh;
                overflow: hidden;
                font-family: monospace;
            }

            .album {
                position: static;
                width: 180px;
                cursor: pointer;
            }

            #info {
                display: none;
                color: white;
                padding: 30px;
                text-align: left;
            }

            #tracks {
                white-space: pre-line;
                line-height: 1.5;
                text-align: left;
            }

            #home {
                position: fixed;
                top: 30px;
                right: 30px;
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 10px;
            }

            .laurel {
                position: fixed;
                bottom: 15px;
                left: 15px;
                color: white;
                cursor: pointer;
            }

            #cover {
                width: 300px;
                max-width: 80%;
            }

            #date,
            #runtime {
                color: #838383;
                margin: 2px;
            }

            #streaming {
                margin: 20px;
            }

            #description {
                white-space: pre-line;
                opacity: 0.5;
            }

            .link {
                position: static;
                display: block;
                width: fit-content;
                color: white;
                text-decoration: none;
                margin-bottom: 6px;
            }

            #links {
                position: fixed;
                top: 30px;
                left: 30px;
            }

            .link:hover {
                opacity: 0.5;
            }

            .sc {
                color: #ed9a42;
            }

            .spt {
                color: #03d84f;
            }

            .apl {
                color: #ff627c;
            }

            .bc {
                color: #629aa9;
            }

            #streaming .sc,
            #streaming .spt,
            #streaming .apl,
            #streaming .bc {
                position: static;
                margin: 0 8px;
                text-decoration: none;
            }

            #streaming a:hover {
                opacity: 0.6;
            }

            #credits {
                color: #838383;
                opacity: 1;
            }

            #credits a {
                color: #d2d2d2;
                text-decoration: none;
            }

            #credits a:hover {
                opacity: 0.6;
            }

            .back a {
                color: #b1b1b1;
                text-decoration: none;
            }

            .yanny {
                position: static;
                width: 180px;
            }
        </style>
    </head>

    <body>
        <div id="home">
            <img class="album" src="dress.webp" data-release="0" />
            <img class="album" src="swing.gif" data-release="1" />
            <img class="album" src="spin.gif" data-release="2" />
            <img class="album" src="complexnumbers.jpg" data-release="3" />
            <a href="https://soundcloud.com/yanny-448088463">
                <img class="yanny" src="purp.png" />
            </a>
        </div>

        <div id="links">
            <a class="link sc" href="https://soundcloud.com/laurel-572942456" target="_blank">soundcloud</a>
            <a class="link spt" href="https://open.spotify.com/artist/1eGKEKKEYhhSiYKTU6g43A" target="_blank">
                spotify
            </a>
            <a class="link apl" href="https://music.apple.com/us/artist/laurel/1766167119" target="_blank">
                apple music
            </a>
        </div>

        <div id="info">
            <img id="cover" />
            <h1 id="title"></h1>
            <p id="date"></p>
            <p id="runtime"></p>
            <p id="description"></p>
            <h3 id="tracklisttitle">tracklist</h3>
            <p id="tracks"></p>
            <h3>credits</h3>
            <p id="credits"></p>
            <div id="streaming"></div>

            <span class="back"><a href="#" onclick="gohome()">back</a></span>
        </div>

        <div class="laurel" onclick="playMusic()">© <span id="year"></span> laurel</div>

        <script src="/scripts/year.js"></script>
        <script src="/scripts/laurel.js"></script>
    </body>
</html>
